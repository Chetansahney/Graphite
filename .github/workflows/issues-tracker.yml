name: Issues Tracker Report

on:
  # Run every Monday at 08:00 UTC to keep the report fresh
  schedule:
    - cron: "0 8 * * 1"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to look back for issues"
        required: false
        default: "30"

jobs:
  generate-issues-report:
    name: Generate Known Issues Report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate issues report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const days = parseInt('${{ github.event.inputs.days || 30 }}', 10);
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - days);
            const since = cutoffDate.toISOString();
            const sinceShort = since.slice(0, 10);
            const today = new Date().toISOString().slice(0, 10);

            console.log(`Fetching issues created since ${sinceShort} (last ${days} days)`);

            // Fetch open issues from upstream
            const upstreamOpen = await github.paginate(github.rest.issues.listForRepo, {
              owner: 'GraphiteEditor',
              repo: 'Graphite',
              state: 'open',
              since,
              per_page: 100,
            });

            // Fetch closed issues from upstream
            const upstreamClosed = await github.paginate(github.rest.issues.listForRepo, {
              owner: 'GraphiteEditor',
              repo: 'Graphite',
              state: 'closed',
              since,
              per_page: 100,
            });

            // Filter out pull requests and issues older than cutoff
            const filterIssues = (issues) => issues
              .filter(i => !i.pull_request)
              .filter(i => new Date(i.created_at) >= cutoffDate)
              .sort((a, b) => b.number - a.number);

            const openIssues = filterIssues(upstreamOpen);
            const closedIssues = filterIssues(upstreamClosed);

            // Build markdown table rows
            const formatLabels = (labels) =>
              labels.length ? labels.map(l => `\`${l.name}\``).join(', ') : '—';

            const openRows = openIssues.map(i =>
              `| [#${i.number}](${i.html_url}) | ${i.title.replace(/\|/g, '\\|')} | ${formatLabels(i.labels)} | ${i.created_at.slice(0, 10)} |`
            ).join('\n');

            const closedRows = closedIssues.map(i =>
              `| [#${i.number}](${i.html_url}) | ${i.title.replace(/\|/g, '\\|')} | ${formatLabels(i.labels)} | ${i.created_at.slice(0, 10)} |`
            ).join('\n');

            const content = `# Known Issues Tracker

> **Timeframe:** Last ${days} days — issues created between **${sinceShort}** and **${today}**
>
> **Fork notice:** This repository (\`Chetansahney/Graphite\`) is a personal fork of the upstream project [\`GraphiteEditor/Graphite\`](https://github.com/GraphiteEditor/Graphite). Issues are tracked in the upstream repository. The fork itself has no independent issues filed.
>
> _Auto-generated by the [Issues Tracker workflow](https://github.com/Chetansahney/Graphite/actions/workflows/issues-tracker.yml) on ${today}._

---

## Fork vs. Upstream

| Repository | Issues filed (last ${days} days) | Issue tracker link |
|---|---|---|
| **Fork** \`Chetansahney/Graphite\` | 0 (no independent issues) | [View](https://github.com/Chetansahney/Graphite/issues) |
| **Upstream** \`GraphiteEditor/Graphite\` | ${openIssues.length + closedIssues.length} (${openIssues.length} open + ${closedIssues.length} closed) | [View](https://github.com/GraphiteEditor/Graphite/issues) |

All links below point to the **upstream** issue tracker where the activity is tracked.

---

## Upstream Open Issues (last ${days} days)

> ${openIssues.length} open issues created since ${sinceShort}.

| # | Title | Labels | Created |
|---|-------|--------|---------|
${openRows || '| — | No open issues in this timeframe | — | — |'}

---

## Upstream Closed Issues (last ${days} days)

> ${closedIssues.length} closed issues created since ${sinceShort}.

| # | Title | Labels | Created |
|---|-------|--------|---------|
${closedRows || '| — | No closed issues in this timeframe | — | — |'}

---

> For the latest list, visit the [upstream issues page](https://github.com/GraphiteEditor/Graphite/issues).
`;

            const fs = require('fs');
            fs.writeFileSync('KNOWN_ISSUES.md', content, 'utf8');
            console.log(`Written KNOWN_ISSUES.md with ${openIssues.length} open and ${closedIssues.length} closed issues.`);

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet KNOWN_ISSUES.md; then
            echo "No changes to KNOWN_ISSUES.md — nothing to commit."
          else
            git add KNOWN_ISSUES.md
            git commit -m "chore: update KNOWN_ISSUES.md report [skip ci]"
            git push
          fi
